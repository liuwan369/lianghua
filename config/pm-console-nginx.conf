# Install as /etc/nginx/sites-available/pm-console, linked from sites-enabled.
# Replace 3-254-138-119.sslip.io if the box gets another name; issue the
# certificate with: certbot certonly --webroot -w /var/www/html -d <name>
# Basic Auth is the console's only login: create the file with
#   htpasswd -B -c /etc/nginx/pm-console.htpasswd <user>
# The backend trusts X-PM-Authenticated and X-Forwarded-Proto only because this
# file overwrites them on every request (PM_TRUST_ACCOUNT_PROXY=1).
limit_req_zone $binary_remote_addr zone=pm_console:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pm_console_write:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=pm_console_streams:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 3-254-138-119.sslip.io;

    # Certificate renewal (certbot webroot) is answered here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 308 https://3-254-138-119.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 3-254-138-119.sslip.io;

    ssl_certificate /etc/letsencrypt/live/3-254-138-119.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3-254-138-119.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    auth_basic "Polymarket Console";
    auth_basic_user_file /etc/nginx/pm-console.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;

    # Identity headers for every location; set here so no block can forget one.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-PM-Authenticated $remote_user;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;

    # Every account has its own console instance (config/accounts.json:
    # id -> port) under /acct/<id>/; nginx strips the prefix. The bare paths
    # (/, /console/, /api/) keep serving account 1 so old bookmarks work.

    # Account 1: push stream (one long-lived GET per page; unbuffered, no 60 s cut).
    location = /acct/1/api/stream {
        limit_req zone=pm_console burst=20 nodelay;
        limit_conn pm_console_streams 4;
        proxy_pass http://127.0.0.1:18766/api/stream;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Account 1: start/stop, strategy drafts, ledger reset (a person clicks these).
    location ~ ^/acct/1/api/(runtime/commands|strategy/|ledger/reset) {
        limit_req zone=pm_console_write burst=5 nodelay;
        rewrite ^/acct/1(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18766;
        proxy_read_timeout 60s;
    }

    location ^~ /acct/1/ {
        limit_req zone=pm_console burst=20 nodelay;
        proxy_pass http://127.0.0.1:18766/;
        proxy_read_timeout 60s;
    }

    # Account 2: push stream (one long-lived GET per page; unbuffered, no 60 s cut).
    location = /acct/2/api/stream {
        limit_req zone=pm_console burst=20 nodelay;
        limit_conn pm_console_streams 4;
        proxy_pass http://127.0.0.1:18776/api/stream;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Account 2: start/stop, strategy drafts, ledger reset (a person clicks these).
    location ~ ^/acct/2/api/(runtime/commands|strategy/|ledger/reset) {
        limit_req zone=pm_console_write burst=5 nodelay;
        rewrite ^/acct/2(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18776;
        proxy_read_timeout 60s;
    }

    location ^~ /acct/2/ {
        limit_req zone=pm_console burst=20 nodelay;
        proxy_pass http://127.0.0.1:18776/;
        proxy_read_timeout 60s;
    }

    # The bare paths: account 1 (bookmarks from before the accounts). Writes
    # keep their own rate limit here too.
    location = /api/stream {
        limit_req zone=pm_console burst=20 nodelay;
        limit_conn pm_console_streams 4;
        proxy_pass http://127.0.0.1:18766;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ~ ^/api/(runtime/commands|strategy/|ledger/reset) {
        limit_req zone=pm_console_write burst=5 nodelay;
        proxy_pass http://127.0.0.1:18766;
        proxy_read_timeout 60s;
    }

    location = / {
        return 302 /acct/1/console/;
    }

    location / {
        limit_req zone=pm_console burst=20 nodelay;
        proxy_pass http://127.0.0.1:18766;
        proxy_read_timeout 60s;
    }
}
