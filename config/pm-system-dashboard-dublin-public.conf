limit_req_zone $binary_remote_addr zone=pm_dashboard_public:10m rate=10r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 34-242-206-196.sslip.io;
    return 308 https://34-242-206-196.sslip.io$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 34-242-206-196.sslip.io;

    ssl_certificate /etc/letsencrypt/live/34-242-206-196.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/34-242-206-196.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Public console access explicitly requested by the operator.
    auth_basic off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 1m;

    location / {
        limit_req zone=pm_dashboard_public burst=20 nodelay;
        proxy_pass http://127.0.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-PM-Authenticated $remote_user;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
