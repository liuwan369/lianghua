limit_req_zone $binary_remote_addr zone=pm_dashboard_public:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=pm_dashboard_streams:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 34-242-206-196.sslip.io;

    # Certificate renewal (certbot webroot) is answered here, so renewal no
    # longer swaps the whole site to a 503 page (second audit).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 308 https://34-242-206-196.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 34-242-206-196.sslip.io;

    ssl_certificate /etc/letsencrypt/live/34-242-206-196.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/34-242-206-196.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Protect the page and every API with the server-managed console password.
    auth_basic "Polymarket BTC Console";
    auth_basic_user_file /etc/nginx/pm-dashboard.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    # Console push (server-sent events): one long-lived GET per page. Without
    # this block nginx buffers the stream and cuts it after 60 s.
    location = /api/stream {
        limit_req zone=pm_dashboard_public burst=20 nodelay;
        # A page holds one stream; cap per address so one client cannot take
        # every backend slot (50) and push the others back to polling.
        limit_conn pm_dashboard_streams 4;
        proxy_pass http://127.0.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-PM-Authenticated $remote_user;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        limit_req zone=pm_dashboard_public burst=20 nodelay;
        proxy_pass http://127.0.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-PM-Authenticated $remote_user;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
