limit_req_zone $binary_remote_addr zone=paper_grid:10m rate=10r/s;

server {
    listen 80;
    server_name 13-115-254-211.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location = /wallet-monitor.html {
        root /var/www/html;
        default_type text/html;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location / { return 301 https://$host:8765$request_uri; }
}

server {
    listen 8765 ssl;
    server_name 13-115-254-211.sslip.io 13.115.254.211;

    ssl_certificate /etc/letsencrypt/live/13-115-254-211.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13-115-254-211.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /wallet-monitor.html {
        root /var/www/html;
        default_type text/html;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        limit_req zone=paper_grid burst=20 nodelay;
        proxy_pass http://127.0.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
