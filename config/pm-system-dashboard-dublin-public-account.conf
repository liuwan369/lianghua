# Install as /etc/systemd/system/pm-system-dashboard-dublin.service.d/public-account.conf
# Explicit operator choice: anyone reaching this HTTPS origin may check/save
# the configured account. This does not enable trading or bypass its control token.
[Service]
# Give short console checks CPU time alongside continuous analytics on t3.small.
CPUWeight=1000
Environment=PM_ACCOUNT_PUBLIC_ORIGIN=https://34-242-206-196.sslip.io
Environment=PM_ACCOUNT_RPC_URL=https://polygon.drpc.org
Environment=PM_ACCOUNT_RPC_FALLBACK_URL=https://polygon-bor-rpc.publicnode.com
Environment=PM_ACCOUNT_NODE_COMPILE_CACHE=/root/.cache/pm-system/account-node-compile
